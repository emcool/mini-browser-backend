<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      padding: 16px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #testButton {
      background: #059669;
    }

    #testButton:hover {
      background: #047857;
    }

    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      background: #111827;
      color: #d1d5db;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    main {
      padding: 12px;
    }

    #browserFrame {
      display: block;
      width: 100%;
      height: 70vh;
      min-height: 350px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: white;
    }

    .note {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mini Browser</h1>

    <div class="toolbar">
      <input
        id="urlInput"
        type="text"
        placeholder="Enter a website, e.g. https://example.com"
        value="https://example.com"
      >

      <button id="goButton" type="button">Go</button>
      <button id="testButton" type="button">Test Backend</button>
    </div>

    <div id="status" role="status" aria-live="polite">
      Ready.
    </div>
  </header>

  <main>
    <iframe
      id="browserFrame"
      title="Website display"
      src="about:blank"
      referrerpolicy="no-referrer"
    ></iframe>

    <p class="note">
      Some websites do not allow iframe display. If a site refuses to load,
      try opening it in a regular browser tab. The backend test checks
      connectivity only; it does not bypass website or school restrictions.
    </p>
  </main>

  <script>
    const BACKEND_URL =
      "https://mini-browser-backend-3p62.onrender.com";

    const urlInput = document.getElementById("urlInput");
    const status = document.getElementById("status");
    const browserFrame = document.getElementById("browserFrame");

    document.getElementById("goButton").addEventListener("click", openSite);

    document.getElementById("testButton").addEventListener(
      "click",
      testBackend
    );

    urlInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        openSite();
      }
    });

    function openSite() {
      let address = urlInput.value.trim();

      if (!address) {
        status.textContent = "Enter a website address first.";
        return;
      }

      if (!/^https?:\/\//i.test(address)) {
        address = "https://" + address;
      }

      try {
        const parsed = new URL(address);

        if (parsed.protocol !== "https:" &&
            parsed.protocol !== "http:") {
          status.textContent = "Only HTTP and HTTPS addresses are supported.";
          return;
        }

        urlInput.value = parsed.href;
        browserFrame.src = parsed.href;
        status.textContent =
          "Requested website. It may refuse to load inside this frame.";
      } catch (error) {
        status.textContent = "That doesn't look like a valid website address.";
      }
    }

    async function testBackend() {
      status.textContent = "Testing backend connection...";

      try {
        const response = await fetch(
          BACKEND_URL + "/api/test",
          { method: "GET" }
        );

        if (!response.ok) {
          status.textContent =
            "Server returned HTTP " + response.status + ".";
          return;
        }

        const data = await response.json();

        status.textContent =
          "Connected! " + (data.message || "Backend responded successfully.");
      } catch (error) {
        status.textContent =
          "Connection failed: " + error.message +
          ". Check the backend URL, CORS settings, and deployment status.";
      }
    }
  </script>
</body>
</html>
