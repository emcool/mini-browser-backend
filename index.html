<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Browser Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      padding: 16px;
      background: #1f2937;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .address {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 11px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: white;
    }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #d1d5db;
      overflow-wrap: anywhere;
    }

    main {
      padding: 12px;
    }

    iframe {
      width: 100%;
      height: 70vh;
      min-height: 350px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: white;
    }

    .note {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mini Browser Test</h1>

    <div class="address">
      <input
        id="address"
        type="text"
        value="https://mini-browser-backend-3p62.onrender.com/demo"
        readonly
        aria-label="Demo page address"
      >

      <button id="reload" type="button">Reload Demo</button>
      <button id="open" type="button">Open Demo Separately</button>
    </div>

    <div id="status" role="status" aria-live="polite">
      Ready to test the demo page.
    </div>
  </header>

  <main>
    <iframe
      id="page"
      title="Controlled demo page"
      src="https://mini-browser-backend-3p62.onrender.com/demo"
    ></iframe>

    <p class="note">
      This page tests whether the browser permits the hosted demo
      to appear inside a frame. If the frame is blocked, use the
      separate-tab button to check whether the demo itself works.
    </p>
  </main>

  <script>
    const demoURL =
      "https://mini-browser-backend-3p62.onrender.com/demo";

    const frame = document.getElementById("page");
    const status = document.getElementById("status");

    document.getElementById("reload").addEventListener("click", () => {
      frame.src = demoURL;
      status.textContent =
        "Reload requested. Check whether the demo appears below.";
    });

    document.getElementById("open").addEventListener("click", () => {
      window.open(demoURL, "_blank", "noopener");
      status.textContent =
        "Opened a separate-tab request. Check the new tab.";
    });
  </script>
</body>
</html>
